name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nyra
          POSTGRES_PASSWORD: nyra
          POSTGRES_DB: nyra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nyra" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://nyra:nyra@localhost:5432/nyra
      APP_ENV: dev
      AUTH_MODE: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: lint
        working-directory: apps/api
        run: python -m ruff check . || true   # prototype: advisory until the codebase stabilises

      - name: migrations (fresh database)
        working-directory: apps/api
        run: python -m nyra_api.cli db:migrate

      - name: migrations are idempotent
        working-directory: apps/api
        run: python -m nyra_api.cli db:migrate

      - name: seed demo data
        working-directory: apps/api
        run: python -m nyra_api.cli db:seed

      - name: smoke
        working-directory: apps/api
        run: python -m nyra_api.cli smoke

      - name: tests
        working-directory: apps/api
        run: python -m pytest -q

      - name: no secrets committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.p12$'; then
            echo "::error::secret-bearing file is tracked"; exit 1
          fi
          echo "no tracked secret files"
